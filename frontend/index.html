<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📋 Job Application Tracker</h1>
            <p>Track your job applications and stay organized</p>
        </header>

        <main>
            <!-- Add Application Form -->
            <section class="form-section">
                <h2>Add New Application</h2>
                <form id="applicationForm">
                    <div class="form-group">
                        <label for="company">Company Name *</label>
                        <input type="text" id="company" required placeholder="e.g., Google, Microsoft">
                    </div>

                    <div class="form-group">
                        <label for="position">Position *</label>
                        <input type="text" id="position" required placeholder="e.g., Software Engineer, Product Manager">
                    </div>

                    <div class="form-group">
                        <label for="jobLink">Job Link</label>
                        <input type="url" id="jobLink" placeholder="https://careers.example.com/job/123">
                    </div>

                    <div class="form-group">
                        <label for="notes">Notes</label>
                        <textarea id="notes" placeholder="Any additional notes..."></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary">Add Application</button>
                </form>
            </section>

            <!-- Applications List -->
            <section class="list-section">
                <h2>My Applications</h2>
                <div id="applicationsContainer" class="applications-container">
                    <p class="loading">Loading applications...</p>
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 Job Application Tracker | Built with AWS</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
